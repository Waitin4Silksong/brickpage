<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>brickpage</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
      <div class="container"><a href="https://m-homupage.vercel.app" style="margin-left: 2%; color: gray">Switch to mobile version</a>
        <h2 style="font-size: 2em;">Send me something anonymously!</h2>
        <div id="drawTab">
            <div class="row">
                <div class="column" style="padding:1%; max-width: 250px;"><br>
                    Size
                    <input type="range" id="brushSize" min="1" max="80" value="10">
                    <br><br>
                    Flow
                    <input type="range" id="opacity" min="0.1" max="1" step="0.05" value="1"><br><br>
                    <div style="display:flex; flex-direction: row;"><button onclick="toggleTool('picker')" id="pickerBtn" style="max-height: 42px; padding: 2%; margin-right: 5%">Picker</button><input type="color" id="colorPicker" value="#000000" style="height:42px; width:42px; margin-bottom: 15px"><p style="padding:2%; color:gray;">Free pick</p></div>
                    <div style="user-select: none;">
                        <div class="color-btn" data-color="#000000" style="background:black"></div>
                        <div class="color-btn" data-color="#696969" style="background:dimgray"></div>
                        <div class="color-btn" data-color="#808080" style="background:gray"></div>
                        <div class="color-btn" data-color="#a9a9a9" style="background:darkgray"></div>
                        <div class="color-btn" data-color="#d3d3d3" style="background:lightgray"></div>
                        <div class="color-btn" data-color="#ffffff" style="background:white"></div>

                        <div class="color-btn" data-color="#ff0000" style="background:red"></div>
                        <div class="color-btn" data-color="#0000ff" style="background:blue"></div>
                        <div class="color-btn" data-color="#00ff00" style="background:lime"></div>
                        <div class="color-btn" data-color="#ffff00" style="background:yellow"></div>
                        <div class="color-btn" data-color="#ffa500" style="background:orange"></div>
                        <div class="color-btn" data-color="#ff00ff" style="background:fuchsia"></div>

                        <div class="color-btn" data-color="#796153" style="background:#796153"></div>
                        <div class="color-btn" data-color="#fcddca" style="background:#fcddca"></div>
                        <div class="color-btn" data-color="#ae9d5f" style="background:#ae9d5f"></div>
                        <div class="color-btn" data-color="#629454" style="background:#629454"></div>
                        <div class="color-btn" data-color="#97c2ee" style="background:#97c2ee"></div>
                        <div class="color-btn" data-color="#faabd1" style="background:#faabd1"></div>
                    </div>
                    <br><div style="line-height:1.5em; font-size: 0.9em;">Hotkeys:<br><kbd>Ctrl</kbd> + <kbd>Z</kbd> to Undo, <kbd>Ctrl</kbd> + <kbd>Y</kbd> to Redo<br><kbd>Del</kbd> to Clear canvas</div>
                </div>
                <div class="column" style="display: flex; flex-direction: column; user-select: none;">
                    <div style="flex-direction: row; margin-bottom:0.5em"><button onclick="undo()">Undo</button>
                    <button onclick="redo()">Redo</button>
                    <button onclick="clearCanvas()">Clear</button><br></div>
                    <canvas id="canvas" width="600" height="400"></canvas>
                    <div style="width:100%; display:flex; flex-direction: row"><button onclick="downloadDrawing()" style="padding:2%; width: 50%">Download drawing</button><button onclick="sendDrawingOnly()" style="padding:2%; width: 50%">Send drawing!</button></div>
                </div>
                <div class="column" style="padding-top:2%; padding-left:2%; max-width: 140px;">
                <input type="file" id="fileInput" hidden accept="image/png,image/jpeg,image/jpg,image/bmp">
                <label for="fileInput" style="display:block; max-width: 150px; border: 1px solid gray; padding: 6%; margin:5%">Select file...</label>
                <div id="filename"></div>
                <img id="output" style="margin:5%; max-width:150px; max-height:150px;">
                <script>
                    const input = document.getElementById("fileInput");
                    const output = document.getElementById("filename");
                    const img = document.getElementById("output");
                    input.addEventListener("change", function () {
                        const file = this.files[0];
                        if (!file) return;
                        const maxSize = 2 * 1024 * 1024; // 2MB
                        const allowedTypes = ["image/png", "image/jpeg", "image/jpg", "image/bmp"];
                        if (!allowedTypes.includes(file.type)) {
                            output.textContent = "Sorry: PNG, JPG and BMP only!";
                            input.value = "";
                            img.src = "";
                            return;
                        }
                        if (file.size > maxSize) {
                            output.textContent = "File is too large (max 2MB)";
                            input.value = "";
                            img.src = "";
                            return;
                        }
                        if (file) {
                            output.textContent = file.name;
                            img.src = URL.createObjectURL(file);
                            img.onload = function() {
                                URL.revokeObjectURL(img.src);
                            }
                        } else {
                            output.textContent = "";
                            img.src = "";
                        }
                    });
                </script>
                    <button onclick="sendFileOnly()" style="max-width: 150px; padding:6%; margin: 5%">Send image!</button>
                </div>
            </div>
        </div>
      </div>
    <div class="sidebar">
        <a href="https://youtu.be/uKxyLmbOc0Q" style="font-size: 2em" target="_blank"><div style="display:block;margin-inline:10px;margin-block:2%">dekocap</div></a><br>
        <a href="https://youtu.be/uKxyLmbOc0Q" style="font-size: 2em" target="_blank"><img src="userpic.jpg" alt="dekocap" width="80%"></a>
        <textarea id="text" placeholder="Text me anonymously..." style="margin-top: 1em"></textarea>
        <script>
          const textarea = document.getElementById("text");
          textarea.addEventListener("input", function () {
          this.style.height = "auto";
          const maxHeight = 150; // max-height
          if (this.scrollHeight <= maxHeight) {
            this.style.height = this.scrollHeight + "px";
            this.style.overflowY = "hidden";
          }
          else {
            this.style.height = maxHeight + "px";
            this.style.overflowY = "auto";
          }
          });
        </script>
        <button id="sendbtn" onclick="sendTextOnly()" style="margin-top: auto; padding:20%; border-left: none; border-right: none; border-bottom: none">Send message!</button>
      </div>
      <div id="loader" class="loader hidden">
        <div class="spinner"></div>
        <p>Sending...</p>
      </div>
      <!-- НАЧАЛО JS -->
      <!-- рисование -->
      <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        let drawing = false;
        let color = "#000000";
        let tool = "brush";
        let brushSize = 10;
        let opacity = 1;
        let history = [];
        let redoStack = [];
        let lastX = 0;
        let lastY = 0;
        window.addEventListener("load", () => {
          const saved = localStorage.getItem("savedCanvas");
          if (saved) {
            restore(saved);
            history.push(saved);
          }
          else {
            fillWhiteBackground();
            saveState();
          }
        });
        // выбор цвета
        document.getElementById("colorPicker").addEventListener("input", (e) => {
          color = e.target.value;
        });
        // палитра
        document.querySelectorAll(".color-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            color = btn.dataset.color;
            document.getElementById("colorPicker").value = color;
            document.querySelectorAll(".color-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
          });
        });
        // размер
        const sizeSlider = document.getElementById("brushSize");
        sizeSlider.addEventListener("input", (e) => {
          brushSize = e.target.value;
        });
        // прозрачность
        const opacitySlider = document.getElementById("opacity");
        opacitySlider.addEventListener("input", (e) => {
          opacity = e.target.value;
        });
        canvas.addEventListener("pointerdown", (e) => {
          const x = e.offsetX;
          const y = e.offsetY;
          if (tool === "picker") {
            const pixel = ctx.getImageData(x, y, 1, 1).data;
            color = `rgb(${pixel[0]}, ${pixel[1]}, ${pixel[2]})`;
            document.getElementById("colorPicker").value =
              rgbToHex(pixel[0], pixel[1], pixel[2]);
            tool = "brush";
            document.getElementById("pickerBtn").classList.remove("active");
            return;
          }
          drawing = true;
          canvas.setPointerCapture(e.pointerId);
          lastX = x;
          lastY = y;
        });
        canvas.addEventListener("pointerup", (e) => {
          drawing = false;
          canvas.releasePointerCapture(e.pointerId);
          ctx.globalAlpha = 1;
          saveState();
        });
        canvas.addEventListener("pointerleave", () => {
          drawing = false;
        });
        canvas.addEventListener("pointermove", (e) => {
          if (!drawing) return;
          const x = e.offsetX;
          const y = e.offsetY;
          const dx = x - lastX;
          const dy = y - lastY;
          const distance = Math.sqrt(dx * dx + dy * dy);
          const step = brushSize / 5;
          ctx.fillStyle = color;
          ctx.globalAlpha = opacity;
          ctx.globalCompositeOperation = "source-over";
          for (let i = 0; i < distance; i += step) {
            const t = i / distance;
            const ix = lastX + dx * t;
            const iy = lastY + dy * t;
            ctx.beginPath();
            ctx.arc(ix, iy, brushSize / 2, 0, Math.PI * 2);
            ctx.fill();
          }
          lastX = x;
          lastY = y;
        });
        // цвет
        function hexToRgba(hex, alpha) {
          const r = parseInt(hex.slice(1, 3), 16);
          const g = parseInt(hex.slice(3, 5), 16);
          const b = parseInt(hex.slice(5, 7), 16);
          return `rgba(${r},${g},${b},${alpha})`;
        }
        function rgbToHex(r, g, b) {
          return "#" + [r, g, b]
            .map(x => x.toString(16).padStart(2, "0"))
            .join("");
        }
        // история
        function saveState() {
          const data = canvas.toDataURL();
          history.push(data);
          if (history.length > 50) history.shift();
          redoStack = [];
          localStorage.setItem("savedCanvas", data);
        }
        function undo() {
          if (history.length > 1) {
            redoStack.push(history.pop());
            restore(history[history.length - 1]);
          }
        }
        function redo() {
          if (redoStack.length > 0) {
            const state = redoStack.pop();
            history.push(state);
            restore(state);
          }
        }
        function restore(dataURL) {
          const img = new Image();
          img.src = dataURL;
          img.onload = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);
          };
        }
        // очистка
        function clearCanvas() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          fillWhiteBackground();
          localStorage.removeItem("savedCanvas");
          saveState();
        }
        // хоткеи
        document.addEventListener("keydown", (e) => {
          if (e.ctrlKey && e.code === "KeyZ") {
            e.preventDefault();
            undo();
          }
          if (e.ctrlKey && e.code === "KeyY") {
            e.preventDefault();
            redo();
          }
          if (e.key === "Delete") {
            e.preventDefault();
            clearCanvas();
          }
        });
        // блоб
        function getCanvasBlob() {
          return new Promise((resolve) => {
            canvas.toBlob((blob) => resolve(blob), "image/png");
          });
        }
        function toggleTool(nextTool) {
          const btn = document.getElementById("pickerBtn");
          if (tool === nextTool) {
            tool = "brush";
            btn.classList.remove("active");
          } else {
            tool = nextTool;
            btn.classList.add("active");
          }
        }
      </script>
      <!-- ОТПРАВКА -->
      <script>
        async function sendTextOnly() {
          const text = document.getElementById("text").value;
          try {
            showLoader();
            const res = await fetch("/api/send", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ type: "text", text })
            });
            if (!res.ok) throw new Error(await res.text());
            alert("Sent!");
          } catch (err) {
            alert("Error: " + err.message);
          } finally {
            hideLoader();
          }
        }
        /* */
        async function sendFileOnly() {
          const file = document.getElementById("fileInput").files[0];
          if (!file) return alert("No file");
          const formData = new FormData();
          formData.append("type", "image");
          formData.append("file", file);
          try {
            showLoader();
            const res = await fetch("/api/send", {
              method: "POST",
              body: formData
            });
            if (!res.ok) throw new Error(await res.text());
            alert("Image sent!");
          } catch (err) {
            alert("Error: " + err.message);
          } finally {
            hideLoader();
          }
        }
        /* */
        async function sendDrawingOnly() {
          const blob = await getCanvasBlob();
          const formData = new FormData();
          formData.append("type", "image");
          formData.append("file", blob, "drawing.png");
          try {
            showLoader();
            const res = await fetch("/api/send", {
              method: "POST",
              body: formData
            });
            if (!res.ok) throw new Error(await res.text());
            alert("Drawing sent!");
          } catch (err) {
            alert("Error: " + err.message);
          } finally {
            hideLoader();
          }
        }
        function downloadDrawing() {
          const link = document.createElement("a");
          link.download = "drawing.png";
          link.href = canvas.toDataURL("image/png");
          link.click();
        }
        function fillWhiteBackground() {
          ctx.save();
          ctx.globalCompositeOperation = "source-over";
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.restore();
        }
        function showLoader() {
          document.getElementById("loader").classList.remove("hidden");
        }
        function hideLoader() {
          document.getElementById("loader").classList.add("hidden");
        }
     </script>
</body>
